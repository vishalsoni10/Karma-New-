name: Ensure Karma Google Favicon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Karma favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          # 32x32 square Karma lotus favicon, generated from the supplied logo.
          favicon_b64 = ""
          Path('favicon.png').write_bytes(base64.b64decode(favicon_b64))

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          import re
          tag = '<link rel="icon" type="image/png" href="/favicon.png">'
          text = re.sub(r'<link[^>]+rel=["\']icon["\'][^>]*>', tag, text, count=1, flags=re.I)
          if tag not in text:
              pos = text.lower().find('</head>')
              if pos == -1:
                  raise SystemExit('Missing </head>')
              text = text[:pos] + tag + '\n' + text[pos:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit favicon integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html favicon.png
          if git diff --cached --quiet; then
            echo 'Karma favicon already installed.'
          else
            git commit -m 'Set Karma lotus logo as Google favicon'
            git push
          fi
