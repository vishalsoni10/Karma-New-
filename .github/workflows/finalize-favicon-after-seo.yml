name: Finalize Karma Google Favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for SEO rebuild to finish
        run: sleep 120

      - name: Ensure favicon link survives SEO rebuilds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="icon" href="/favicon.png" type="image/png">'
          s = re.sub(r'\n?<link[^>]+rel=["\'](?:icon|shortcut icon)["\'][^>]*>', '', s, flags=re.I)
          pos = s.lower().find('</head>')
          if pos == -1:
              raise SystemExit('Missing </head>')
          s = s[:pos] + '\n' + tag + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Karma favicon link is already correct.'
          else
            git commit -m 'Ensure Karma Google favicon link [skip ci]'
            git push
          fi
