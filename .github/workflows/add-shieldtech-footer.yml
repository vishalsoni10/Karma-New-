name: Update Karma Jain Event Section and SEO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-karma-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize Karma homepage for Jain event SEO
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from datetime import date

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # --- Core metadata: align the homepage with the business's strongest topic. ---
          text = re.sub(r'<title>.*?</title>',
                        '<title>Jain Event Organizer in India | Karma Event Management &amp; Hospitality</title>',
                        text, count=1, flags=re.I | re.S)
          description = ('Karma Event Management & Hospitality is a Jain event organizer in India specializing in Jain Sangh, Bus Sangh, Chaturmas, Paryushan, Upadhan Tap, Yatra, Pratishtha, hospitality, room allotment, logistics, attendance, bahuman, prabhavna and complete on-ground event administration.')
          text = re.sub(r'<meta\s+name=["\']description["\'][^>]*>',
                        f'<meta name="description" content="{description}">',
                        text, count=1, flags=re.I | re.S)

          seo_head_marker = '<!-- KARMA SEO HEAD -->'
          text = re.sub(re.escape(seo_head_marker) + r'.*?</script>\s*', '', text, flags=re.I | re.S)
          seo_head = f'''{seo_head_marker}
          <link rel="canonical" href="https://karmaevent.in/">
          <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
          <meta property="og:type" content="website">
          <meta property="og:url" content="https://karmaevent.in/">
          <meta property="og:title" content="Jain Event Organizer in India | Karma Event Management &amp; Hospitality">
          <meta property="og:description" content="Jain Sangh, Bus Sangh, Chaturmas, Yatra, hospitality, logistics, room allotment, attendance, bahuman, prabhavna and complete Jain event administration across India.">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Jain Event Organizer in India | Karma Event Management &amp; Hospitality">
          <meta name="twitter:description" content="Professional Jain event management, administration, hospitality, logistics and on-ground execution across India.">
          <script type="application/ld+json">
          {{
            "@context":"https://schema.org",
            "@type":"Organization",
            "name":"Karma Event Management & Hospitality",
            "url":"https://karmaevent.in/",
            "description":"Jain event organizer and event management company specializing in Jain Sangh, Bus Sangh, Chaturmas, Paryushan, Upadhan Tap, Yatra, hospitality, logistics and on-ground administration.",
            "areaServed":"India",
            "address":{{"@type":"PostalAddress","addressLocality":"Palitana","addressRegion":"Gujarat","addressCountry":"IN"}},
            "knowsAbout":["Jain Event Management","Jain Sangh Management","Bus Sangh Management","Jain Chaturmas Management","Jain Hospitality Management","Room Allotment","Event Logistics","Attendance Management","Bahuman","Prabhavna"]
          }}
          </script>
          '''
          head_pos = text.lower().find('</head>')
          if head_pos == -1:
              raise SystemExit('</head> not found')
          text = text[:head_pos] + seo_head + text[head_pos:]

          # --- Jain administration section: keep it immediately after the Palitana block. ---
          marker = '<!-- KARMA JAIN EVENT ADMINISTRATION -->'
          existing = re.search(re.escape(marker) + r'.*?</section>\s*', text, flags=re.I | re.S)
          if existing:
              section = existing.group(0)
              text = text[:existing.start()] + text[existing.end():]
          else:
              section = r'''<!-- KARMA JAIN EVENT ADMINISTRATION -->
          <style>
          .karma-jain-admin{padding:clamp(80px,10vh,130px) clamp(24px,8vw,120px);background:#0D0D0D;position:relative;z-index:1}
          .karma-jain-admin-inner{max-width:1200px;margin:auto}
          .karma-jain-admin-label{display:block;color:#D4AF37;font:500 .55rem 'Montserrat',sans-serif;letter-spacing:.55em;text-transform:uppercase;margin-bottom:16px}
          .karma-jain-admin-title{font:600 clamp(2rem,4.5vw,4rem) 'Cinzel',serif;color:#F8F5EE;line-height:1.12;margin:0 0 20px}
          .karma-jain-admin-title span{color:#D4AF37}
          .karma-jain-admin-intro{max-width:820px;color:rgba(248,245,238,.62);font:300 1rem/1.9 'Montserrat',sans-serif;margin-bottom:52px}
          .karma-jain-admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
          .karma-jain-admin-card{padding:30px 26px;background:rgba(255,255,255,.025);border:1px solid rgba(212,175,55,.14);transition:.3s}
          .karma-jain-admin-card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.45);background:rgba(212,175,55,.045)}
          .karma-jain-admin-num{color:#D4AF37;font:500 .58rem 'Montserrat',sans-serif;letter-spacing:.25em;margin-bottom:18px}
          .karma-jain-admin-card h3{color:#F8F5EE;font:600 1.12rem 'Cinzel',serif;margin-bottom:12px}
          .karma-jain-admin-card p{color:rgba(248,245,238,.55);font:300 .82rem/1.8 'Montserrat',sans-serif}
          .karma-jain-admin-bottom{margin-top:42px;padding:28px 30px;border:1px solid rgba(212,175,55,.16);color:rgba(248,245,238,.6);font:300 .88rem/1.85 'Montserrat',sans-serif}
          .karma-jain-admin-bottom strong{color:#D4AF37;font-weight:500}
          @media(max-width:800px){.karma-jain-admin-grid{grid-template-columns:1fr 1fr}}
          @media(max-width:520px){.karma-jain-admin-grid{grid-template-columns:1fr}.karma-jain-admin{padding-left:20px;padding-right:20px}}
          </style>
          <section class="karma-jain-admin" id="jain-event-management" aria-labelledby="jain-admin-title">
          <div class="karma-jain-admin-inner">
          <span class="karma-jain-admin-label">Jain Event Administration &amp; Hospitality</span>
          <h2 class="karma-jain-admin-title" id="jain-admin-title">Why Choose Us for <span>Your Jain Event?</span></h2>
          <p class="karma-jain-admin-intro">Karma specialises in the administration behind Jain Sangh, Yatra, Chaturmas, Paryushan, Upadhan Tap, Samvatsari, Pratishtha and other religious programs — from guest records and room allotment to transportation, attendance, bahuman, prabhavna, hospitality and on-ground coordination.</p>
          <div class="karma-jain-admin-grid">
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">01 / ADMINISTRATION</div><h3>Complete Jain Event Administration</h3><p>Centralized planning, schedules, registrations, guest records, team coordination and day-to-day administration.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">02 / ROOM ALLOTMENT</div><h3>Room Allotment &amp; Accommodation</h3><p>Systematic room allocation, check-in coordination, guest lists, room records and accommodation support.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">03 / HOSPITALITY</div><h3>Jain Hospitality Management</h3><p>Welcome desks, helpdesks, VIP care and respectful hospitality coordination for guests and religious programs.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">04 / LOGISTICS</div><h3>Logistics &amp; Transportation</h3><p>Bus Sangh coordination, vehicle planning, pickup and drop, railway and airport coordination, routes and movement.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">05 / ATTENDANCE</div><h3>Attendance &amp; Registration</h3><p>Participant registration, attendance tracking, family and group records, counters and event-day coordination.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">06 / BAHUMAN &amp; PRABHAVNA</div><h3>Bahuman &amp; Prabhavna Management</h3><p>Planning and coordination for bahuman, prabhavna, felicitation, gifts, dignitary arrangements and presentation flow.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">07 / FOOD &amp; SEVA</div><h3>Food, Seva &amp; Swamivatsalya</h3><p>Guest meal coordination, Ayambil and religious food arrangements, Swamivatsalya planning, counters and volunteers.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">08 / SANGH</div><h3>Sangh &amp; Bus Sangh Management</h3><p>End-to-end coordination including registration, accommodation, transportation, hospitality and volunteer support.</p></article>
          <article class="karma-jain-admin-card"><div class="karma-jain-admin-num">09 / EXECUTION</div><h3>On-Ground Event Execution</h3><p>Supervision across vendors, volunteers, schedules, guest movement, stage programs and operational requirements.</p></article>
          </div>
          <div class="karma-jain-admin-bottom"><strong>Premium Jain Event Management</strong> means more than decoration. Karma combines administration, logistics, hospitality, room allotment, attendance, bahuman, prabhavna, food, transportation and complete on-ground execution for a disciplined and dignified Jain event experience.</div>
          </div>
          </section>
          '''

          target = re.search(r'Proudly\s+Based\s+in\s+Palitana,\s+Gujarat', text, flags=re.I)
          if not target:
              matches = list(re.finditer(r'Palitana', text, flags=re.I))
              target = matches[-1] if matches else None
          if target:
              section_end = text.find('</section>', target.end())
              if section_end != -1:
                  insert_at = section_end + len('</section>')
                  text = text[:insert_at] + '\n\n' + section + text[insert_at:]
              else:
                  raise SystemExit('Could not find closing section after Palitana block')
          else:
              raise SystemExit('Could not find Palitana text in index.html')

          # --- Visible SEO hub immediately after the hero: useful content, not a keyword wall. ---
          hub_marker = '<!-- KARMA JAIN SEO HUB -->'
          text = re.sub(re.escape(hub_marker) + r'.*?</section>\s*', '', text, flags=re.I | re.S)
          hub = r'''<!-- KARMA JAIN SEO HUB -->
          <section class="karma-seo-hub" id="jain-event-organizer" aria-labelledby="karma-seo-title">
            <div class="karma-seo-hub-inner">
              <span class="karma-jain-admin-label">Jain Event Organizer in India</span>
              <h2 id="karma-seo-title">Jain Event Management, Administration &amp; Hospitality</h2>
              <p>Karma Event Management &amp; Hospitality is a Palitana-based Jain event organizer serving Jain Sangh, Bus Sangh, religious yatras, Chaturmas, Paryushan, Upadhan Tap, Pratishtha and other Jain programs across India. Our work goes beyond decoration: we coordinate registration, attendance, room allotment, hospitality, transportation, logistics, bahuman, prabhavna, food, volunteers and complete on-ground execution.</p>
              <div class="karma-seo-links">
                <a href="/jain-event-organizer/">Jain Event Organizer</a>
                <a href="/jain-event-management/">Jain Event Management</a>
                <a href="/jain-sangh-management/">Jain Sangh Management</a>
                <a href="/jain-chaturmas-management/">Jain Chaturmas Management</a>
                <a href="/jain-hospitality-management/">Jain Hospitality Management</a>
                <a href="/jain-event-logistics/">Jain Event Logistics</a>
              </div>
            </div>
          </section>
          <style>
          .karma-seo-hub{padding:72px clamp(24px,8vw,120px);background:#111;position:relative;z-index:1;border-top:1px solid rgba(212,175,55,.1);border-bottom:1px solid rgba(212,175,55,.1)}
          .karma-seo-hub-inner{max-width:1100px;margin:auto}
          .karma-seo-hub h2{font:600 clamp(1.8rem,4vw,3.2rem) 'Cinzel',serif;color:#F8F5EE;line-height:1.2;margin:0 0 20px}
          .karma-seo-hub p{max-width:900px;color:rgba(248,245,238,.62);font:300 1rem/1.9 'Montserrat',sans-serif}
          .karma-seo-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
          .karma-seo-links a{padding:11px 16px;border:1px solid rgba(212,175,55,.2);color:#D4AF37;text-decoration:none;font:500 .7rem 'Montserrat',sans-serif;letter-spacing:.08em;text-transform:uppercase}
          .karma-seo-links a:hover{border-color:#D4AF37;background:rgba(212,175,55,.06)}
          </style>
          '''
          hero = re.search(r'<section\b[^>]*\bid=["\']hero["\'][^>]*>.*?</section>', text, flags=re.I | re.S)
          if hero:
              text = text[:hero.end()] + '\n\n' + hub + text[hero.end():]

          path.write_text(text, encoding='utf-8')

          # Keep the sitemap current and include the dedicated, indexable service pages.
          today = date.today().isoformat()
          sitemap = Path('sitemap.xml')
          urls = [
              '/',
              '/jain-event-organizer/',
              '/jain-event-management/',
              '/jain-sangh-management/',
              '/jain-chaturmas-management/',
              '/jain-hospitality-management/',
              '/jain-event-logistics/',
          ]
          body = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in urls:
              priority = '1.0' if u == '/' else '0.8'
              body += [f'  <url><loc>https://karmaevent.in{u}</loc><lastmod>{today}</lastmod><changefreq>weekly</changefreq><priority>{priority}</priority></url>']
          body.append('</urlset>')
          sitemap.write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY

      - name: Commit website SEO improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No website changes needed.'
          else
            git commit -m 'Improve Jain event SEO architecture'
            git push
          fi
