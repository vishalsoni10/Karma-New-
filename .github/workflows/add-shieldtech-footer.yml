name: Add ShieldTech Footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ShieldTech footer
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "<!-- SHIELDTECH FOOTER -->"

          if marker not in text:
              footer = '''\n<!-- SHIELDTECH FOOTER -->\n<style>\n  .shieldtech-credit {\n    padding: 22px 20px 26px;\n    text-align: center;\n    background: #0A0A0A;\n    border-top: 1px solid rgba(212,175,55,0.15);\n    font-family: 'Montserrat', sans-serif;\n    font-size: 12px;\n    letter-spacing: .08em;\n    color: rgba(248,245,238,0.55);\n  }\n  .shieldtech-credit .heart { color: #4da3ff; }\n  .shieldtech-credit a {\n    color: #D4AF37;\n    text-decoration: none;\n    font-weight: 500;\n  }\n  .shieldtech-credit a:hover { color: #F5D67B; }\n</style>\n<div class="shieldtech-credit">\n  Built by <span class="heart">💙</span> with <a href="tel:8881988802">ShieldTech Services</a> · Contact <a href="tel:8881988802">8881988802</a>\n</div>\n'''
              body_close = text.rfind("</body>")
              if body_close == -1:
                  raise SystemExit("</body> not found in index.html")
              text = text[:body_close] + footer + text[body_close:]
              path.write_text(text, encoding="utf-8")
          else:
              print("ShieldTech footer already present")

      - name: Commit footer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add ShieldTech Services website credit"
          git push
