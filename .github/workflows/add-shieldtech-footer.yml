name: Add Jain Event Section and ShieldTech Footer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Jain focused Why Choose section and footer
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          why_marker = "<!-- KARMA JAIN WHY CHOOSE US -->"
          if why_marker not in text:
              section = '''
<!-- KARMA JAIN WHY CHOOSE US -->
<style>
  .jain-why-section { position:relative; padding:clamp(80px,10vh,130px) clamp(24px,8vw,120px); background:linear-gradient(180deg,#0A0A0A 0%,#111111 50%,#0A0A0A 100%); border-top:1px solid rgba(212,175,55,.12); border-bottom:1px solid rgba(212,175,55,.12); overflow:hidden; }
  .jain-why-inner { position:relative; z-index:1; max-width:1200px; margin:0 auto; }
  .jain-why-head { text-align:center; max-width:880px; margin:0 auto 55px; }
  .jain-why-label { display:block; color:#D4AF37; font:500 .55rem 'Montserrat',sans-serif; letter-spacing:.55em; text-transform:uppercase; margin-bottom:16px; }
  .jain-why-title { font:600 clamp(2rem,4.5vw,4rem) 'Cinzel',serif; color:#F8F5EE; line-height:1.12; margin:0 0 20px; }
  .jain-why-title span { color:#D4AF37; }
  .jain-why-intro { color:rgba(248,245,238,.62); font:300 .92rem/1.9 'Montserrat',sans-serif; max-width:820px; margin:auto; }
  .jain-why-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .jain-why-card { padding:28px 25px; background:rgba(255,255,255,.025); border:1px solid rgba(212,175,55,.14); transition:transform .3s,border-color .3s,background .3s; }
  .jain-why-card:hover { transform:translateY(-5px); border-color:rgba(212,175,55,.45); background:rgba(212,175,55,.045); }
  .jain-why-num { color:#D4AF37; font:500 .56rem 'Montserrat',sans-serif; letter-spacing:.25em; margin-bottom:16px; }
  .jain-why-card h3 { color:#F8F5EE; font:600 1.08rem 'Cinzel',serif; margin-bottom:11px; line-height:1.35; }
  .jain-why-card p { color:rgba(248,245,238,.54); font:300 .77rem/1.8 'Montserrat',sans-serif; }
  .jain-why-bottom { margin-top:42px; padding-top:28px; border-top:1px solid rgba(212,175,55,.13); color:rgba(248,245,238,.58); font:300 .86rem/1.85 'Montserrat',sans-serif; text-align:center; }
  .jain-why-bottom strong { color:#D4AF37; font-weight:500; }
  @media(max-width:850px){ .jain-why-grid{grid-template-columns:1fr 1fr;} }
  @media(max-width:560px){ .jain-why-grid{grid-template-columns:1fr;} .jain-why-section{padding-left:20px;padding-right:20px;} }
</style>
<section class="jain-why-section" id="why-choose-us" aria-labelledby="jain-why-title">
  <div class="jain-why-inner">
    <div class="jain-why-head">
      <span class="jain-why-label">Jain Event Management Specialists</span>
      <h2 class="jain-why-title" id="jain-why-title">Why Choose Us for Your <span>Jain Event?</span></h2>
      <p class="jain-why-intro">Jain events require specialised administration, seva coordination and hospitality — not just decoration. Karma provides structured on-ground management for Jain Sanghs, Trusts, Samajs, Derasars and religious organisations, with careful attention to every guest and every detail.</p>
    </div>
    <div class="jain-why-grid">
      <article class="jain-why-card"><div class="jain-why-num">01 / ADMINISTRATION</div><h3>Complete Jain Event Administration</h3><p>Centralised planning, registration, attendance, participant records, helpdesk, volunteer coordination and day-to-day administration for smooth event operations.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">02 / HOSPITALITY</div><h3>Jain Hospitality & Guest Management</h3><p>Dedicated guest care for Sangh members, families, VIP guests and visiting Jain Guru Bhagwant, Sadhu-Sadhvi Maharaj with organised reception and support.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">03 / ROOMS</div><h3>Room Allotment & Accommodation</h3><p>Guest registration, room allotment, occupancy planning, hotel coordination, room lists, check-in support and complete accommodation management for Jain Sanghs.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">04 / LOGISTICS</div><h3>Jain Event Logistics & Transportation</h3><p>End-to-end logistics including buses, vehicles, pick-up and drop, railway and airport coordination, parking, route planning and on-ground movement.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">05 / BAHUMAN</div><h3>Bahuman & Prabhavna Management</h3><p>Careful coordination of Bahuman, Prabhavna, welcome arrangements, honour ceremonies, gift distribution and dignified guest experiences.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">06 / ATTENDANCE</div><h3>Attendance & Registration Management</h3><p>Participant registration, attendance tracking, Sangh lists, guest records, counters, badges and organised data handling for large Jain gatherings.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">07 / SANGH</div><h3>Jain Sangh & Bus Sangh Coordination</h3><p>Jain Sangh and Bus Sangh coordination covering schedules, transportation, accommodation, food, volunteers, attendance and on-ground support.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">08 / SEVA</div><h3>Food, Seva & Swamivatsalya</h3><p>Food service coordination, Ayambil arrangements, Swamivatsalya management, volunteer deployment and organised guest-flow planning.</p></article>
      <article class="jain-why-card"><div class="jain-why-num">09 / EXECUTION</div><h3>One Team from Planning to Execution</h3><p>One accountable team coordinating administration, hospitality, logistics, venue operations, decoration, stage, AV and complete event execution.</p></article>
    </div>
    <div class="jain-why-bottom"><strong>Karma Event Management &amp; Hospitality</strong> specialises in professional Jain event management — including Sangh, Yatra, Chaturmas, Paryushan, Samvatsari, Upadhan Tap, Pratishtha, Mahotsav and other Jain religious and community programs.</div>
  </div>
</section>
'''
              body_close = text.rfind("</body>")
              if body_close == -1:
                  raise SystemExit("</body> not found in index.html")
              text = text[:body_close] + section + text[body_close:]

          footer_marker = "<!-- SHIELDTECH FOOTER -->"
          if footer_marker not in text:
              footer = '''
<!-- SHIELDTECH FOOTER -->
<style>
  .shieldtech-credit { padding:22px 20px 26px; text-align:center; background:#0A0A0A; border-top:1px solid rgba(212,175,55,.15); font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.08em; color:rgba(248,245,238,.55); }
  .shieldtech-credit .heart { color:#4da3ff; }
  .shieldtech-credit a { color:#D4AF37; text-decoration:none; font-weight:500; }
  .shieldtech-credit a:hover { color:#F5D67B; }
</style>
<div class="shieldtech-credit">Built by <span class="heart">💙</span> with <a href="tel:8881988802">ShieldTech Services</a> · Contact <a href="tel:8881988802">8881988802</a></div>
'''
              body_close = text.rfind("</body>")
              if body_close == -1:
                  raise SystemExit("</body> not found in index.html")
              text = text[:body_close] + footer + text[body_close:]

          path.write_text(text, encoding="utf-8")

      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Jain focused Why Choose Us section"
          git push
