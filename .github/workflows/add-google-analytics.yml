name: Add Google Analytics

on:
  workflow_run:
    workflows: ["Update Karma Jain Event Section"]
    types: [completed]

permissions:
  contents: write

jobs:
  add-google-analytics:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Google Analytics tag
        run: |
          python3 <<'PY'
          from pathlib import Path

          tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-KHL3ZV7VZN"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-KHL3ZV7VZN');
          </script>'''

          for filename in ['index.html', 'admin.html', 'seo-keywords.html']:
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'G-KHL3ZV7VZN' in text:
                  print(f'{filename}: Google Analytics already present')
                  continue
              lower = text.lower()
              marker = '<head>'
              if marker not in lower:
                  print(f'{filename}: <head> not found; skipped')
                  continue
              pos = lower.find(marker) + len(marker)
              text = text[:pos] + '\n' + tag + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              print(f'{filename}: Google Analytics added')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html seo-keywords.html
          if git diff --cached --quiet; then
            echo 'No website changes needed.'
          else
            git commit -m 'Add Google Analytics tracking'
            git push origin main
          fi
