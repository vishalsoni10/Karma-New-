name: Add Google Analytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-google-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Google Analytics tag
        run: |
          python3 <<'PY'
          from pathlib import Path

          tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-KHL3ZV7VZN"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-KHL3ZV7VZN');
          </script>'''

          for filename in ['index.html', 'admin.html', 'seo-keywords.html']:
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'G-KHL3ZV7VZN' in text:
                  print(f'{filename}: Google Analytics already present')
                  continue
              marker = '<head>'
              if marker not in text.lower():
                  print(f'{filename}: <head> not found; skipped')
                  continue
              pos = text.lower().find(marker) + len(marker)
              text = text[:pos] + '\n' + tag + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              print(f'{filename}: Google Analytics added')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html seo-keywords.html
          if git diff --cached --quiet; then
            echo 'No website changes needed.'
          else
            git commit -m 'Add Google Analytics tracking'
            git push
          fi
